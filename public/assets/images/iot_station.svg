<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="antennaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g1)" rx="12"/>
  
  <!-- Server Rack & IoT Station Graphics -->
  <g transform="translate(150, 60)">
    <!-- Tower Body -->
    <rect x="80" y="80" width="140" height="220" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Server Slots -->
    <rect x="90" y="100" width="120" height="24" rx="4" fill="#0f172a" stroke="#334155"/>
    <circle cx="105" cy="112" r="4" fill="#10b981"/>
    <circle cx="120" cy="112" r="4" fill="#00f0ff"/>
    <line x1="140" y1="112" x2="195" y2="112" stroke="#475569" stroke-width="2"/>

    <rect x="90" y="135" width="120" height="24" rx="4" fill="#0f172a" stroke="#334155"/>
    <circle cx="105" cy="147" r="4" fill="#10b981"/>
    <circle cx="120" cy="147" r="4" fill="#f59e0b"/>
    <line x1="140" y1="147" x2="195" y2="147" stroke="#475569" stroke-width="2"/>

    <rect x="90" y="170" width="120" height="24" rx="4" fill="#0f172a" stroke="#334155"/>
    <circle cx="105" cy="182" r="4" fill="#10b981"/>
    <circle cx="120" cy="182" r="4" fill="#10b981"/>
    <line x1="140" y1="182" x2="195" y2="182" stroke="#475569" stroke-width="2"/>

    <rect x="90" y="205" width="120" height="24" rx="4" fill="#0f172a" stroke="#334155"/>
    <circle cx="105" cy="217" r="4" fill="#ec4899"/>
    <circle cx="120" cy="217" r="4" fill="#00f0ff"/>
    <line x1="140" y1="217" x2="195" y2="217" stroke="#475569" stroke-width="2"/>

    <rect x="90" y="240" width="120" height="45" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="150" y="268" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">STATUS: OK</text>

    <!-- Antenna -->
    <line x1="150" y1="80" x2="150" y2="20" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="150" cy="16" r="10" fill="url(#antennaGlow)"/>
    <circle cx="150" cy="16" r="4" fill="#00f0ff"/>
    
    <!-- Wireless signal waves -->
    <path d="M 125,5 A 35,35 0 0,1 175,5" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <path d="M 110,-10 A 55,55 0 0,1 190,-10" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <path d="M 95,-25 A 75,75 0 0,1 205,-25" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Labels -->
  <text x="300" y="360" fill="#f8fafc" font-size="16" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Trạm Thu Thập Viễn Trắc &amp; Quan Trắc IoT Mạng</text>
  <text x="300" y="380" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">Tự động truyền dữ liệu qua HTTP REST, FTP Backup &amp; SMTP Alarm</text>
</svg>
